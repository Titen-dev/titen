<!--meta title="Daily Brief · Titen" description="The last 48 hours on the topics you care about, in a few honest lines with sources." scripts="brief.js" -->
<section class="page-head">
  <div class="wrap">
    <div class="eyebrow"><span class="eyebrow-label">Daily brief</span><span class="eyebrow-rule"></span><span class="eyebrow-note"><span data-today>Today</span></span></div>
    <h1 class="display-2">Your brief, <em>without the noise.</em></h1>
    <p class="section-lede">Choose up to six topics. Titen reads the last 48 hours of news on each and writes a short brief, every line linked to its source. Your choice stays in this browser.</p>
    <div class="chips chips-wrap" role="group" aria-label="Topics" data-topics></div>
    <p class="hint" data-topic-hint>Pick a topic to begin.</p>
  </div>
</section>
<section class="section section-tight">
  <div class="wrap">
    <div class="briefs" data-briefs aria-live="polite"></div>
  </div>
</section>
